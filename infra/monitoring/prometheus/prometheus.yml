# Prometheus config for the Vellar stack (docs/observability.md).
#
# Local: `docker compose -f infra/monitoring/docker-compose.yml up -d` while the
# services run on the host (`pnpm dev`). Targets reach the host through
# host.docker.internal (mapped to the host gateway in the compose file).
#
# Deployed: replace the targets with the services' real host:port, or — for the
# all-in-one process — keep only the gateway (the shared registry is
# process-wide and labelled by `service`) plus the worker.

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    stack: vela

rule_files:
  - /etc/prometheus/rules/vela-alerts.yml
  - /etc/prometheus/rules/dlq-alerts.yaml
  - /etc/prometheus/rules/prometheus-rules-wallet-cache.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: vela-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4000"]

  - job_name: vela-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:4001 # wallet-service
          - host.docker.internal:4002 # lifecycle-service
          - host.docker.internal:4003 # policy-service
          - host.docker.internal:4004 # verification-service
          - host.docker.internal:4006 # permission-service

  - job_name: vela-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4005"] # WORKER_METRICS_PORT
