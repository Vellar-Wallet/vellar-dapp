packages:
  - "apps/*"
  - "packages/*"
  - "services/*"
allowBuilds:
  esbuild: true
  sharp: true
  spawn-sync: false
  "@tailwindcss/oxide": true
  # Pulled in transitively by @creit.tech/stellar-wallets-kit's WalletConnect
  # module (2026-09-11, marketplace step 1). None needs its build script for the
  # four wallets we register (Freighter, Albedo, xBull, LOBSTR): bufferutil and
  # utf-8-validate are optional native speedups for `ws` with pure-JS fallbacks,
  # secp256k1 likewise falls back to its JS implementation, and @reown/appkit's
  # postinstall is only telemetry/asset setup. Left unbuilt to keep the install
  # free of native toolchain requirements.
  '@reown/appkit': false
  bufferutil: false
  secp256k1: false
  utf-8-validate: false
minimumReleaseAgeExclude:
  - vellar-sdk@0.6.2
# Security overrides: force patched versions of vulnerable TRANSITIVE deps
# (Dependabot alerts, 2026-07). All same-major, backward-compatible patch/minor
# bumps. Re-check + prune when the direct deps that pull these in are upgraded.
overrides:
  # sac-sdk 0.4.3 hard-pins stellar-sdk 16.0.0-rc.1, whose ESM build is broken
  # (imports a `config` export that @stellar/js-xdr@4 doesn't provide) and
  # crashes the backend at first import on Render. Force it onto the stable
  # 16.0.1 every first-party package already uses; drop when sac-sdk ships a
  # release depending on a stable SDK.
  "sac-sdk>@stellar/stellar-sdk": "^16.0.1"
  axios@>=1.0.0 <1.18.0: ">=1.18.1"
  # Blanket fast-uri pins: the range-scoped keys didn't catch parents that pin
  # an exact 4.1.0/3.1.3, so force the whole 3.x and 4.x lines to the patch.
  # The whole 4.x line resolves here through @fastify/ajv-compiler -> fastify
  # (the live backend HTTP stack). Bumped 4.1.2 -> 4.1.3 on 2026-09-07: four
  # further advisories (SSRF via malformed input and via repeated characters,
  # host confusion via skipped IDN canonicalisation and via percent-encoded
  # scheme) landed after the original pin, and 4.1.2 was exactly what resolved.
  # A bare key (no @range selector) is required here: the selector form
  # `fast-uri@4` left ajv@8.20.0 and @fastify/ajv-compiler@4.0.5 resolving
  # 4.1.2 anyway. The bare key forces every resolution in the graph.
  fast-uri: ">=4.1.3"
  shell-quote@<=1.8.4: ">=1.9.0"
  sharp@<0.35.0: ">=0.35.0"
  # Backend-runtime highs (2026-08): both are in the live services' HTTP stack.
  # find-my-way is fastify's router (service-kit>fastify); the advisory is an
  # HTTP/2 request DoS (only reachable if http2 is ever enabled, but cheap to
  # patch). undici is the gateway's reverse-proxy transport
  # (api-gateway>@fastify/http-proxy>@fastify/reply-from>undici).
  find-my-way@<9.6.1: ">=9.6.1"
  # Bound to <8: @fastify/reply-from declares undici ^7, so an 8.x would violate
  # its spec. 7.29.0 is both the advisory fix and the top of the 7.x line.
  undici@>=7.0.0 <7.29.0: ">=7.29.0 <8"
  # Dev-only toolchain highs (WXT extension build; never shipped to runtime).
  # Clean same-major patches — pin so `pnpm audit --audit-level=high` is green.
  tmp@<0.2.6: ">=0.2.6"
  adm-zip@<0.6.0: ">=0.6.0"
  brace-expansion@<1.1.18: ">=1.1.18"
  nanoid@<3.3.17: ">=3.3.17"
  # Dev-only (2026-09-07). None of the three reaches runtime:
  # browserslist via wxt -> @vitejs/plugin-react -> @babel/core (extension
  # build); esbuild via drizzle-kit in three services and vite/wxt in the
  # extension; uuid via wxt -> web-ext-run -> node-notifier.
  # Versions are the advisories' own floors, not round numbers: esbuild needs
  # 0.28.1 (the low arbitrary-file-read advisory), not 0.25.x — 0.25.12 and
  # 0.27.7 both resolve here and 0.27.7 is inside the vulnerable range. uuid
  # needs 11.1.1; 8.3.2 is what resolves today, so this is a major bump of a
  # dev-only transitive.
  browserslist@<4.28.7: ">=4.28.7"
  esbuild@<0.28.1: ">=0.28.1"
  uuid@<11.1.1: ">=11.1.1"
  # toml reaches runtime: passkey-kit -> @openzeppelin/relayer-plugin-channels
  # -> @stellar/stellar-sdk -> toml, used by the SDK's stellar_toml.js to parse
  # a home domain's TOML. 3.0.0 carries an uncontrolled-recursion and a
  # prototype-pollution advisory; the fix line is 4.2.0+. This is a MAJOR bump
  # of a transitive we do not control, so it is verified two ways below rather
  # than assumed: the export surface stays `parse`, and the full suite is green.
  toml@<4.2.0: ">=4.2.0"

# @hookform/resolvers 5.x imports `zod/v4/core` at runtime but declares only
# react-hook-form as a peer. Under pnpm's strict linking zod is never placed
# where the resolver can see it, so the web app's production build fails with
# "Can't resolve 'zod/v4/core'". Declaring the missing peer fixes resolution
# without hoisting anything. Drop when upstream declares zod itself.
packageExtensions:
  "@hookform/resolvers":
    peerDependencies:
      zod: "*"
