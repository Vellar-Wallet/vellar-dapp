# STALE: not the production source of truth (evidence gathered 2026-11-02).
#
# The production backend (the @vellar/all-in-one image) runs on Railway: build is
# the root Dockerfile via railway.json, and the live Railway process has been up
# since 2026-09-29 03:25 UTC. The facilitator is also on Railway; the web app,
# docs, explorer and playground are on Vercel.
#
# This file is NOT a staging template and must not be copied for one. Production
# on Railway is CONFIRMED by the owner (2026-11-02). A Render instance of the same
# backend (vellar-backend.onrender.com, free tier, cold-starting) is nonetheless
# STILL LIVE: it answers /health with 200 and serves the x402 402 challenge for
# stellar:pubnet with the same payTo as Railway. It is therefore a leftover, not a
# deployment target.
# OPERATOR ACTION: suspend or delete the Render web service and its vellar-db, and
# rotate any secret that was ever set there (RELAYER_API_KEY, SPONSOR_SECRET_KEY).
# Staging is defined for Railway in docs/runbooks/staging-and-promotion.md.
#
# Render Blueprint — combined VELA backend + Postgres (free tier).
#
# Deploys the single-process backend (@vellar/all-in-one: gateway + wallet +
# lifecycle + policy) as one free web service, plus a free Postgres.
#
# MAINNET since 2026-09-20 (see docs/decisions.md): the x402 payment gate on
# /lifecycle/execute and /verification/:contractId settles real mainnet USDC,
# so every Stellar endpoint below (RPC, Horizon, passphrase, network, relayer)
# must point at mainnet, not testnet.
#
# Free-tier caveats (STILL APPLY on mainnet — this is about Render's plan,
# not the Stellar network):
#   - the web service SLEEPS after 15 min idle (~1 min cold start on next hit)
#     — a real cost/UX risk now: a paying caller can hit a cold-starting
#     instance. See docs/decisions.md for the 2026-09-19 hibernation incident.
#   - the free Postgres EXPIRES 30 days after creation (14-day grace)
# For a non-expiring DB, swap in an external Postgres (e.g. Neon) and set
# DATABASE_URL as a secret instead.
#
# Secrets NOT in this file (set them in the Render dashboard, marked sync:false):
#   RELAYER_API_KEY, SPONSOR_SECRET_KEY
#   ⚠ VERIFY THESE ARE MAINNET CREDENTIALS after this cutover. Flipping
#   RELAYER_BASE_URL/network config here does NOT change what's already set
#   in the Render dashboard — a leftover testnet API key or sponsor secret
#   paired with mainnet endpoints will fail (or worse, silently mismatch)
#   rather than fixing anything. Confirm in the dashboard before relying on
#   wallet creation/submission after this deploy.

services:
  - type: web
    name: vellar-backend
    runtime: node
    plan: free
    # CD gate (security-audit.md M9 / FIX 11): do NOT auto-deploy on every push
    # to the tracked branch. Deploy manually (or from a tagged release) AFTER CI
    # is green, so an unreviewed/broken commit can't ship a tsx-run backend with
    # live signing keys before the checks run.
    autoDeploy: false
    # Render runs from the repo root; install the workspace, then start the
    # combined backend. (The SDK is a published npm dep — nothing to pre-build.)
    buildCommand: "corepack enable && pnpm install --frozen-lockfile"
    startCommand: "pnpm --filter @vellar/all-in-one start"
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # NOTE: Render injects PORT automatically; the gateway reads it via
      # portFromEnv("PORT", …) and binds 0.0.0.0. Do not hardcode PORT here.
      # Mainnet endpoints (cutover 2026-09-20): the x402 payment gate on
      # /lifecycle/execute and /verification/:contractId requires real mainnet
      # USDC (stellar:pubnet), but this file was never flipped when that gate
      # shipped -- lifecycle-service's account lookups ran against testnet
      # Horizon while payments settled on mainnet, so a mainnet accountId
      # verified against a paid request 404'd with account_not_found even
      # though the account genuinely exists (just not on the network this
      # service was configured for). See docs/decisions.md.
      # Confirmed against OpenZeppelin's own docs (docs.openzeppelin.com/relayer/1.3.x/guides/stellar-channels-guide):
      # mainnet is the BARE host, no /mainnet path segment -- only testnet
      # gets a path suffix ("https://channels.openzeppelin.com/testnet").
      - key: RELAYER_BASE_URL
        value: "https://channels.openzeppelin.com"
      - key: STELLAR_RPC_URL
        value: "https://mainnet.sorobanrpc.com"
      - key: STELLAR_NETWORK_PASSPHRASE
        value: "Public Global Stellar Network ; September 2015"
      # RA-10: the EXPLICIT network signal. The worker refuses to boot without it
      # (no default), and cross-checks it against the passphrase + RPC above.
      # Must agree with them — flip all three together for a testnet rollback.
      - key: STELLAR_NETWORK
        value: "mainnet"
      - key: HORIZON_URL
        value: "https://horizon.stellar.org"
      # Allow the deployed frontend origin (update to the real vellar.xyz once live).
      - key: CORS_ORIGIN
        value: "https://vellar.xyz"
      # Wire the Postgres created below.
      - key: DATABASE_URL
        fromDatabase:
          name: vellar-db
          property: connectionString
      # Secrets — set these in the dashboard (sync:false keeps them out of git).
      - key: RELAYER_API_KEY
        sync: false
      - key: SPONSOR_SECRET_KEY
        sync: false

databases:
  - name: vellar-db
    plan: free
