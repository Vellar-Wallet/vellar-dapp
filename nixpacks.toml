# Railway's Nixpacks builder gives Turborepo's auto-detected pipeline
# (turbo.json) priority over NIXPACKS_BUILD_CMD env vars, so the install
# phase's pinned pnpm@11.9.0 was silently ignored by the build phase, which
# fell back to a different pnpm resolved from PATH and then failed
# `pnpm install --frozen-lockfile` against this repo's lockfile. File-based
# config outranks both the provider's auto-detection and env vars, so pin
# both phases explicitly here instead.
[phases.install]
cmds = ["npm install -g pnpm@11.9.0", "pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["pnpm exec turbo run typecheck --filter=@vellar/all-in-one..."]
