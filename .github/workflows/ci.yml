name: CI

# `dev` is the default branch every contributor PR merges into (#427); without
# it here nothing re-verified dev after a merge landed. The trigger only makes
# CI run — it becomes a merge gate once `ci` is a required status check in the
# branch protection settings (docs/ci-baseline.md).
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vela
          POSTGRES_PASSWORD: vela
          POSTGRES_DB: vela
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U vela"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — pnpm/action-setup reads it from the
      # `packageManager` field in package.json (pnpm@11.9.0). Specifying both
      # errors with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fail the build on any high/critical dependency advisory (M9 / FIX 11).
      # Overrides in pnpm-workspace.yaml keep this green; a newly-introduced high
      # advisory blocks merge until it is patched or explicitly overridden.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Format check
        run: pnpm format:check

      - name: Verify contracts supply-chain hardening
        run: |
          grep -E 'soroban-sdk = "=27\.0\.0"' contracts/Cargo.toml
          grep -E 'ed25519-dalek = "=2\.2\.0"' contracts/Cargo.toml
          grep -E 'rev = "[0-9a-f]{40}"' contracts/Cargo.toml

      - name: Typecheck
        run: pnpm typecheck

      # Docs vs code: documented API routes exist in server.ts, getting-started
      # version floors match engines/packageManager/toolchain, and documented
      # commands still point at real scripts (#747, #749, #750).
      - name: Docs freshness
        run: pnpm check:docs

      # Runbooks vs code: every file, flag, env key and code claim a runbook
      # relies on still exists as named, so an operator is never sent to a
      # stale step during an incident (#751, #752).
      - name: Runbook freshness
        run: pnpm check:runbooks

      - name: Test
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://vela:vela@localhost:5433/vela
          # RA-2: the DB-backed integration tests (incl. the spend-budget
          # concurrency guarantee) must ACTUALLY RUN in CI. With this set, the
          # integration suites FAIL rather than silently skip if the Postgres
          # service ever goes missing, so the atomicity guarantee cannot quietly
          # stop being exercised.
          CI_REQUIRE_DB: "1"

      # No load-test step: 44d8ce1 removed contrib/load-test-submission.ts and the
      # root `test:load` script it backed, which left this step failing on every
      # run. Re-add it with the harness (docs/LOAD_TESTING.md follow-up).

      - name: Build
        run: pnpm build

      # Mocked e2e only (@ci tag): the verify + cleanup + home flows intercept
      # the gateway/Horizon, so they need no backend or secrets. The live-testnet
      # specs (wallet/policy/extension) are NOT tagged @ci and are excluded here
      # — they require a relayer key + running services (run locally / manually).
      - name: Install Playwright browser
        run: pnpm --filter @vellar/web exec playwright install --with-deps chromium

      - name: E2E (mocked, CI-safe)
        run: pnpm --filter @vellar/web test:e2e:ci
