name: Close PRs touching files outside contrib/

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, edited, synchronize]
    branches: [drips]

permissions:
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.state === "closed") return;
            // Maintainers (owner, org members, collaborators) may touch anything.
            if (["OWNER", "MEMBER", "COLLABORATOR"].includes(pr.author_association)) return;

            const ALLOWED_PREFIX = "contrib/";
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const outside = files
              .map((f) => f.filename)
              .filter((path) => !path.startsWith(ALLOWED_PREFIX));

            if (outside.length === 0) return;

            // Filenames are attacker-controlled (security-audit.md I1). Render each as
            // exactly ONE Markdown code span: drop control, line-separator and bidi
            // characters, cap the length, and use a delimiter longer than any backtick
            // run inside so the name cannot close the span and inject Markdown. This
            // stays inline on purpose: adding a checkout step to a pull_request_target
            // workflow would be the real hazard.
            const MAX_NAME = 200;
            const codeSpan = (raw) => {
              let name = String(raw).replace(
                /[\u0000-\u001f\u007f-\u009f\u2028\u2029\u202a-\u202e\u2066-\u2069]/g,
                "\ufffd",
              );
              if (name.length > MAX_NAME) name = name.slice(0, MAX_NAME) + "\u2026";
              const longestRun = Math.max(0, ...(name.match(/`+/g) ?? []).map((r) => r.length));
              const fence = "`".repeat(longestRun + 1);
              const pad = name.startsWith("`") || name.endsWith("`") ? " " : "";
              return fence + pad + name + pad + fence;
            };

            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const list = outside
              .slice(0, 20)
              .map((p) => `- ${codeSpan(p)}`)
              .join("\n");
            const more = outside.length > 20 ? `\n- …and ${outside.length - 20} more` : "";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: [
                "Thanks for the contribution — but contributor PRs may only change files inside `contrib/`.",
                "",
                "This PR touches file(s) outside that folder:",
                "",
                list + more,
                "",
                `Please open a new PR with your changes scoped to \`contrib/\` only. See [CONTRIBUTING.md](${repoUrl}/blob/main/CONTRIBUTING.md) and [contrib/README.md](${repoUrl}/blob/main/contrib/README.md). If your assigned issue genuinely needs changes elsewhere, say so on the issue first — don't open a PR outside \`contrib/\`.`,
                "",
                "Questions? Ask in the [Telegram group](https://t.me/+RWPCKXXJTj45Njk0).",
              ].join("\n"),
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: "closed",
            });
